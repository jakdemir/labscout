<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Labscout · Student spinout watchlist</title>
<link rel="preload" href="/fonts/inter-tight-700-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/assets/labscout.css">
<style>
  .page { padding-bottom: 0; }
  .chat { max-width: 860px; margin: 0 auto; }
  .hero { padding: 18px 0 20px; }
  .hero .ink-title { margin: 0 0 10px; width: 100%; max-width: 640px; }
  .hero .ink-title svg { display: block; width: 100%; height: auto; overflow: visible; }
  .hero .ink-title text { fill: var(--ink); font-family: "Arial Black", "Helvetica Neue", Helvetica, Arial, sans-serif; font-weight: 900; }
  .hero .ink-title .ground { fill: none; stroke: var(--ink); stroke-width: 1.3; stroke-linecap: round; }
  .hero .lead { margin: 2px 0 0; max-width: 18em; font-family: "Iowan Old Style", Baskerville, "Palatino Linotype", Georgia, serif; font-size: clamp(22px, 2.4vw, 28px); letter-spacing: -.04em; line-height: 1.2; color: var(--ink); }
  .hero .lead em { font-style: normal; background: var(--hi); padding: 0 .08em; }
  body.has-thread .hero, body.has-thread .starters { display: none; }
  .starters { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-top: 14px; }
  .starters > span { font: 500 9px/1 var(--mono); letter-spacing: 1.1px; color: #6a685f; margin-right: 3px; }

  .thread { display: flex; flex-direction: column; gap: 32px; }
  body.has-thread .thread { padding: 4px 0 28px; }
  .msg-u { align-self: flex-end; max-width: 80%; background: var(--ink); color: var(--paper); padding: 11px 16px; border-radius: 14px 14px 4px 14px; white-space: pre-wrap; overflow-wrap: anywhere; }
  .msg-a { min-width: 0; }
  .hdr { font: 500 12.5px/1.4 var(--mono); color: var(--ink-2); margin: 0 0 12px; display: flex; flex-wrap: wrap; gap: 4px 12px; align-items: center; }
  .hdr b { color: var(--ink); }
  .say { margin: 0 0 12px; }
  .err { border: var(--bw) solid var(--bad); background: var(--bad-wash); color: var(--bad); border-radius: var(--r); padding: 14px 16px; display: flex; flex-wrap: wrap; gap: 12px; align-items: center; justify-content: space-between; }

  .filters { display: flex; flex-wrap: wrap; gap: 8px; margin: 0 0 14px; }
  .filters .chip svg { width: 12px; height: 12px; }
  .market { display: flex; gap: 10px; overflow-x: auto; margin: 0 0 18px; padding-bottom: 4px; scroll-snap-type: x mandatory; }
  .market .lbl { flex: none; align-self: center; }
  .market a { flex: 0 0 auto; max-width: 300px; scroll-snap-align: start; border: var(--bw) solid var(--ink); border-radius: 4px; padding: 8px 10px; font: 400 12px/1.35 var(--mono); text-decoration: none; background: var(--sheet); display: grid; gap: 3px; }
  .market a:hover { background: var(--hi); }
  .market a span { color: var(--ink-3); }

  /* index-card stack */
  .stack { position: relative; outline: none; }
  .srow { position: relative; height: 58px; margin-top: -29px; margin-inline: calc(var(--d) * 6px); }
  .srow:first-child { margin-top: 0; }
  .srow .edge { position: absolute; inset: 29px 0 -29px 0; border: var(--bw) solid var(--ink); border-bottom: 0; border-radius: 10px 10px 0 0; background: var(--sheet); }
  .srow .ftab { position: absolute; top: 0; left: calc(var(--x) * (100% - 236px)); width: 236px; z-index: 1; height: 31px; }
  .srow .ftab .nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .open { position: relative; background: var(--sheet); border: var(--bw) solid var(--ink); border-top: 0; border-radius: 0 0 var(--r-lg) var(--r-lg); padding: 22px 32px 28px; display: grid; gap: 20px; z-index: 2; }
  .open-head { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 14px; }
  .open-head .name-xl { margin-right: 4px; }
  .panel-dark { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.25fr); gap: 24px; }
  .panel-dark .score-xl { margin-top: 18px; display: flex; align-items: flex-end; font-size: clamp(88px, 11vw, 148px); }
  .panel-dark .score-xl small { margin-bottom: 12px; }
  .mom { display: grid; gap: 10px; align-content: end; }
  .mom svg { width: 100%; height: 110px; }
  .mom .cap { font: 400 13px/1.3 var(--mono); color: var(--on-dark); }
  .mom .btn.hi { width: 100%; margin-top: 18px; }
  .brief { white-space: pre-line; margin: 0; font-size: 16px; max-width: 68ch; text-wrap: pretty; }
  .meter { background: transparent; border-top: 0; border-bottom: 0; border-left: 0; text-align: left; cursor: pointer; color: inherit; font: inherit; }
  .meter:hover { background: var(--paper); }
  .meter.dark:hover { background: var(--dark-2); }
  .meter[aria-pressed="true"] .label { background: var(--hi); color: var(--ink); justify-self: start; padding: 0 4px; margin-left: -4px; }
  .ev { display: grid; gap: 14px; }
  .evgrp { display: grid; grid-template-columns: 150px 1fr; gap: 6px 14px; font-size: 14px; }
  .evgrp ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 5px; }
  .evgrp li { overflow-wrap: anywhere; }
  .src { font: 500 10.5px/1 var(--mono); letter-spacing: .06em; text-transform: uppercase; border: 1px solid var(--ink); border-radius: 3px; padding: 2px 4px; margin-right: 6px; vertical-align: 1px; }
  .tag { color: var(--ink-3); font: 400 12px var(--mono); }
  .ev-empty { color: var(--ink-3); font-size: 14px; }
  .actions { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; padding-top: 16px; border-top: 1px solid var(--hair); }
  .actions .btn { height: 34px; font-size: 11.5px; }
  .why { font: 400 13px/1.5 var(--mono); }
  .why summary { cursor: pointer; display: inline-flex; gap: 8px; align-items: center; }
  .why ul { margin: 8px 0 0; padding-left: 18px; font-family: var(--sans); font-size: 14px; }
  .mail { margin-top: 2px; }
  .mail pre { white-space: pre-wrap; font-size: 13px; }

  .drawer { margin: -44px -24px 0; position: relative; z-index: 0; padding-top: 72px; }
  .after { margin-top: 14px; display: grid; gap: 10px; font: 400 12.5px/1.5 var(--mono); color: var(--ink-2); }
  .integ { display: flex; flex-wrap: wrap; gap: 6px 16px; }
  .integ span { display: inline-flex; align-items: center; gap: 7px; }
  .next { display: flex; flex-wrap: wrap; gap: 8px; }
  .empty { border: var(--bw) dashed var(--ink); border-radius: var(--r); padding: 18px; background: var(--sheet); }
  body.has-ranked .chat { max-width: 1180px; }
  .rk { display: flex; flex-direction: column; gap: 28px; padding: 8px 0 12px; }
  .rk-top, .rk-label { display: flex; flex-wrap: wrap; gap: 8px; justify-content: space-between; align-items: center; font: 500 12px/1.4 var(--mono); letter-spacing: .06em; text-transform: uppercase; }
  .rk-top button { min-height: 44px; border: 0; background: none; padding: 0; cursor: pointer; letter-spacing: .06em; }
  .rk-top span, .rk-label span:last-child { color: #4A4A45; }
  .rk-hero { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(260px, 100%), 1fr)); border: 1.5px solid #111; border-radius: 8px; overflow: hidden; text-align: left; }
  .rk-score { padding: 20px 24px; background: #111; color: #F4F4F1; display: flex; flex-direction: column; gap: 6px; }
  .rk-score span, .rk-score em { font: 500 12px/1.4 var(--mono); letter-spacing: .08em; text-transform: uppercase; color: #C9C9C3; font-style: normal; }
  .rk-score div { display: flex; align-items: baseline; gap: 8px; }
  .rk-score b { font: 600 96px/.9 var(--sans); letter-spacing: -.04em; }
  .rk-score small { font: 400 13px/1 var(--mono); color: #C9C9C3; }
  .rk-who, .rk-call { padding: 20px 26px; display: flex; flex-direction: column; gap: 10px; justify-content: center; }
  .rk-who h2, .rk-who .rk-name { margin: 0; font: 600 36px/1.05 var(--sans); letter-spacing: -.02em; display: block; }
  .rk-who p { margin: 0; font-size: 19px; line-height: 1.35; text-wrap: pretty; }
  .rk-chip { padding: 14px; border: 1.5px solid #111; border-radius: 6px; font: 700 17px/1.2 var(--mono); letter-spacing: .04em; text-align: center; }
  .rk-call span, .rk-pull { font: 400 12px/1.5 var(--mono); color: #3A3A36; }
  .rk-spot { display: block; width: 100%; border: 0; background: transparent; padding: 0; color: inherit; cursor: pointer; text-align: left; }
  .rk-spot .rk-hero { width: 100%; }
  .rk-pull { display: block; margin-top: 10px; letter-spacing: .06em; text-transform: uppercase; }
  .rk-rows { display: flex; flex-direction: column; border: 1.5px solid #111; border-radius: 8px; overflow: hidden; }
  .rk-row { border-top: 1.5px solid #111; }
  .rk-row button { all: unset; box-sizing: border-box; cursor: pointer; display: flex; flex-wrap: wrap; align-items: center; gap: 16px 28px; width: 100%; min-height: 84px; padding: 16px 24px; }
  .rk-row.hot button { background: #111; color: #F4F4F1; }
  .rk-row.muted button { color: #55554F; }
  .rk-row button:hover { background: #EAEAE6; }
  .rk-row.hot button:hover { background: #2A2A27; }
  .rk-stage { flex: 0 0 220px; display: flex; flex-direction: column; gap: 4px; }
  .rk-stage b, .rk-stage small { font: 700 14px/1.2 var(--mono); letter-spacing: .04em; }
  .rk-stage small { font-weight: 400; font-size: 11px; letter-spacing: .06em; opacity: .85; }
  .rk-meter { flex: 1 1 320px; max-width: 420px; display: flex; align-items: center; gap: 14px; }
  .rk-meter i { flex: 1; height: 34px; box-sizing: border-box; border: 2px solid currentColor; }
  .rk-meter strong { flex: 0 0 44px; font: 600 26px/1 var(--sans); letter-spacing: -.02em; }
  .rk-saw { flex: 1 1 200px; font-size: 18px; font-weight: 500; }
  .rk-sign { flex: 0 0 32px; height: 32px; display: flex; align-items: center; justify-content: center; border: 1.5px solid currentColor; border-radius: 16px; font: 400 18px/1 var(--mono); }
  .rk-drop { padding: 4px 24px 18px; background: #FBFBF8; border-top: 1px dashed #8A8A84; }
  .rk-ev { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 20px; padding: 12px 0; border-bottom: 1px dashed #B5B5AE; }
  .rk-ev span:first-child { flex: 0 0 72px; font: 400 12px/1.3 var(--mono); color: #4A4A45; }
  .rk-ev span:nth-child(2) { flex: 1 1 280px; font-size: 16px; line-height: 1.35; }
  .rk-ev b { font: 500 11px/1 var(--mono); letter-spacing: .04em; padding: 5px 9px; border: 1.5px solid #111; border-radius: 4px; }
  .rk-split { display: flex; flex-wrap: wrap; gap: 20px; }
  .rk-velocity { flex: 999 1 520px; min-height: 280px; border: 1.5px solid #111; border-radius: 8px; padding: 18px 22px; display: flex; flex-direction: column; gap: 14px; }
  .rk-months { display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); gap: 6px; align-items: end; flex: 1; }
  .rk-month { display: flex; flex-direction: column; align-items: center; justify-content: flex-end; gap: 4px; height: 100%; }
  .rk-month i { width: 70%; max-width: 28px; height: 20px; box-sizing: border-box; border: 1.5px solid #111; background: transparent; }
  .rk-month i.on { background: #111; }
  .rk-month span { width: 100%; padding-top: 4px; border-top: 1.5px solid #111; font: 400 11px/1 var(--mono); color: #4A4A45; text-align: center; }
  .rk-partner { flex: 1 1 340px; border: 1.5px dashed #111; border-radius: 8px; padding: 18px 22px; display: flex; flex-direction: column; gap: 10px; }
  .rk-partner fieldset { margin: 0; padding: 0; border: 0; display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 8px; }
  .rk-partner legend { float: left; padding: 0; font-size: 15px; }
  .rk-partner fieldset div, .rk-calls { display: flex; gap: 12px; }
  .rk-partner fieldset button { border: 0; background: none; padding: 0; cursor: pointer; font: 500 11px/1 var(--mono); letter-spacing: .04em; }
  .rk-partner fieldset button[aria-pressed="true"] { background: var(--hi); }
  .rk-calls { margin-top: auto; padding-top: 8px; gap: 8px; }
  .rk-calls button { flex: 1; height: 44px; border: 1.5px solid #111; border-radius: 22px; background: transparent; font: 600 15px/1 var(--sans); cursor: pointer; }
  .rk-calls button[data-call="meet"], .rk-calls button[aria-pressed="true"] { background: #111; color: #F4F4F1; }
  @media (max-width: 720px) { .rk-score b { font-size: 72px; } .rk-who h2 { font-size: 28px; } .rk-stage { flex-basis: 100%; } .rk-months { gap: 3px; } }
  .load-anim { display: grid; justify-items: center; gap: 12px; width: 100%; padding: 12px 0 4px; text-align: center; }
  .load-anim .eyebrow { margin: 0; font: 500 9px/1 var(--mono); letter-spacing: 1.8px; color: #6a685f; }
  .load-anim h2 { margin: 0; max-width: 16em; min-height: 2.3em; font-family: "Iowan Old Style", Baskerville, "Palatino Linotype", Georgia, serif; font-size: clamp(28px, 4vw, 46px); font-weight: 400; letter-spacing: -.035em; line-height: 1.15; }
  .load-anim .dots { display: flex; gap: 7px; min-height: 4px; }
  .load-anim .dots span { width: 4px; height: 4px; border-radius: 50%; background: #b4b3aa; }
  .load-anim .dots .active { background: var(--ink); }
  .load-anim picture { display: block; width: min(100%, 760px, calc((100svh - 340px) * 1.2)); margin-inline: auto; }
  .load-anim img { display: block; width: 100%; height: auto; aspect-ratio: 6 / 5; object-fit: contain; }
  .load-anim .detail { margin: 0; min-height: 1.2em; font: 400 12px/1.4 var(--mono); color: var(--ink-2); }
  .load-anim .detail:empty { display: none; }
  body.is-loading .msg-u { display: none; }
  body.is-loading .thread { min-height: calc(100svh - 128px); }
  body.is-loading .msg-a { width: 100%; margin-top: auto; margin-bottom: auto; }

  .dock { padding: 0 0 28px; }
  body.has-thread .dock { position: sticky; bottom: 0; z-index: 10; background: var(--paper); padding: 12px 0 16px; border-top: var(--bw) solid var(--ink); }
  body.is-loading .dock { display: none; }
  .composer { display: block; position: relative; padding: 0; background: var(--sheet); border: var(--bw) solid var(--ink); border-radius: var(--r-lg); box-shadow: var(--lift); }
  .composer:focus-within { box-shadow: var(--lift), 0 0 0 4px var(--hi); }
  .composer textarea { display: block; width: 100%; box-sizing: border-box; border: 0; background: transparent; resize: none; outline: none; color: var(--ink); font-size: 14px; line-height: 1.6; padding: 16px 16px 12px; max-height: 200px; min-height: 60px; }
  .composer textarea:focus-visible { outline: none; box-shadow: none; }
  body.has-thread .composer textarea { min-height: 44px; font-size: 14px; }
  .composer textarea::placeholder { color: var(--ink-3); }
  .composer-bar { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 12px; }
  .composer-right { display: flex; align-items: center; gap: 8px; }
  .clip, .connect, .send { cursor: pointer; }
  .clip { width: 34px; height: 34px; padding: 8px; border: 0; border-radius: 8px; background: transparent; color: var(--ink); display: flex; align-items: center; justify-content: center; }
  .clip:hover { background: var(--paper); }
  .clip svg { width: 18px; height: 18px; }
  .connect { display: inline-flex; align-items: center; gap: 5px; border: 1px dashed var(--ink); border-radius: 8px; background: transparent; color: var(--ink-2); font-size: 12px; padding: 7px 9px; }
  .connect:hover { background: var(--paper); color: var(--ink); }
  .send { width: 34px; height: 34px; padding: 7px; border: var(--bw) solid var(--ink); border-radius: 8px; background: transparent; color: var(--ink-3); display: flex; align-items: center; justify-content: center; }
  .send:disabled { opacity: 1; background: transparent; color: var(--ink-3); cursor: default; }
  .send:not(:disabled) { background: var(--ink); color: var(--sheet); }
  .send:not(:disabled):hover { background: var(--dark-2); }
  .source-picker { position: absolute; z-index: 10; right: 12px; top: calc(100% + 8px); width: 280px; background: var(--sheet); border: var(--bw) solid var(--ink); border-radius: var(--r-lg); box-shadow: var(--lift); color: var(--ink); padding: 8px; }
  .source-picker[hidden] { display: none; }
  .picker-title { font-family: var(--mono); font-size: 9px; letter-spacing: 1px; color: var(--ink-3); padding: 7px 8px 10px; }
  .source-picker button { width: 100%; text-align: left; display: flex; flex-direction: column; gap: 4px; background: none; border: 0; border-top: var(--bw) solid var(--hair); padding: 12px 8px; color: var(--ink); font-size: 13px; cursor: pointer; }
  .source-picker button:hover { background: var(--paper); }
  .source-picker small { font-size: 10px; color: var(--ink-3); }
  .notice { font-size: 12px; line-height: 1.5; padding: 10px 12px; background: #f2ed7670; border-left: 2px solid #76703b; margin: 12px 0 0; }
  .notice[hidden] { display: none; }
  .send svg { width: 18px; height: 18px; }
  .scope { display: flex; align-items: center; gap: 8px; margin: 13px 4px 0; font-size: 13px; color: #747269; }
  .scope-mark { font-size: 17px; }
  .scope button { margin-left: auto; background: none; border: 0; padding: 0; color: var(--ink); font: inherit; cursor: pointer; display: inline-flex; gap: 6px; align-items: center; text-decoration: underline; text-underline-offset: 3px; }
  .scope button[hidden] { display: none; }
  .starters .chip { height: auto; border: 1px solid #303030; background: #171717; color: #a3a3a3; padding: 9px 13px; font-size: 12px; border-radius: 999px; gap: 10px; }
  .starters .chip span { color: #a3a3a3; }
  .starters .chip:hover { background: #262626; border-color: #525252; color: #fff; }
  body.has-thread .ls-foot { display: none; }
  .follow-hint { display: none; }
  body.has-thread:not(.is-loading) .connect,
  body.has-thread:not(.is-loading) .source-picker,
  body.has-thread:not(.is-loading) .scope-mark,
  body.has-thread:not(.is-loading) .scope-copy { display: none; }
  body.has-thread:not(.is-loading) .follow-hint { display: inline; }
  body.has-thread:not(.is-loading) .composer { display: flex; align-items: flex-end; gap: 10px; padding: 10px 10px 10px 18px; }
  body.has-thread:not(.is-loading) .composer-bar,
  body.has-thread:not(.is-loading) .composer-right { display: contents; }
  body.has-thread:not(.is-loading) .composer textarea { flex: 1; width: auto; min-height: 40px; font-size: 16px; line-height: 1.5; padding: 8px 0; }
  body.has-thread:not(.is-loading) .clip,
  body.has-thread:not(.is-loading) .send { width: 44px; height: 44px; padding: 0; border-radius: var(--r); flex: none; }
  body.has-thread:not(.is-loading) .clip { border: var(--bw) solid var(--ink); background: transparent; }
  body.has-thread:not(.is-loading) .send,
  body.has-thread:not(.is-loading) .send:disabled,
  body.has-thread:not(.is-loading) .send:not(:disabled) { background: var(--ink); color: var(--paper); border-color: var(--ink); }
  body.has-thread:not(.is-loading) .scope { font: 400 11.5px/1.3 var(--mono); color: var(--ink-3); margin: 8px 4px 0; }
  .ico-go { display: none; }
  body.has-thread:not(.is-loading) .ico-up { display: none; }
  body.has-thread:not(.is-loading) .ico-go { display: block; }

  @media (max-width: 720px) {
    .open { padding: 18px 16px 22px; }
    .panel-dark { grid-template-columns: 1fr; padding: 22px 20px; gap: 12px; }
    .panel-dark .score-xl { font-size: 104px; }
    .srow .ftab { width: 196px; left: calc(var(--x) * (100% - 196px)); gap: 10px; padding: 0 10px; }
    .srow { margin-inline: calc(var(--d) * 3px); }
    .evgrp { grid-template-columns: 1fr; gap: 4px; }
    .drawer { margin: 0 -16px; }
    .msg-u { max-width: 92%; }
    .starters .chip { white-space: normal; min-height: 32px; line-height: 1.3; text-align: left; }
    .market a { max-width: 240px; }
  }
  .composer .attach { display: flex; padding: 0 16px 4px; }
  .composer .attach[hidden] { display: none; }
  .composer.drag { background: var(--sheet); box-shadow: var(--lift), 0 0 0 4px var(--hi); }
  .file-chip { display: inline-flex; align-items: center; gap: 10px; max-width: 100%; height: 34px; padding: 0 6px 0 10px; border: var(--bw) solid var(--ink); border-radius: 6px; background: var(--hi); font: 500 12.5px/1 var(--mono); }
  .file-chip span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .file-chip .meta { color: var(--ink-2); font-weight: 400; }
  .file-chip button { width: 24px; height: 24px; display: grid; place-items: center; border: 0; background: transparent; cursor: pointer; border-radius: 4px; }
  .file-chip button:hover { background: rgba(17,17,17,.1); }
  .msg-u .file-chip { margin-bottom: 8px; }
  .thesis-card { border: var(--bw) solid var(--ink); border-radius: var(--r); background: var(--sheet); padding: 16px 18px; display: grid; gap: 10px; margin-bottom: 14px; }
  .thesis-card h3 { font: 700 20px/1.15 var(--serif); letter-spacing: -.03em; margin: 0; }
  .thesis-card .q { font: 500 13px/1.4 var(--mono); }
  .thesis-card .crit { display: flex; flex-wrap: wrap; gap: 6px; }
  .fit { border: var(--bw) solid var(--ink); border-radius: var(--r); background: var(--sheet); padding: 12px 14px; display: grid; gap: 8px; }
  .fit ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
  .fit li { display: grid; grid-template-columns: 56px 1fr; gap: 10px; align-items: start; font-size: 14px; line-height: 1.4; }
  .fit li b { font-weight: 600; margin-right: 6px; }
  .fit .v { font: 600 11px/20px var(--mono); text-transform: uppercase; letter-spacing: .08em; text-align: center; border: var(--bw) solid var(--ink); border-radius: 4px; }

  ["dragleave", "drop"].forEach(function (ev) { document.addEventListener(ev, function (e) { if (ev === "dragleave" && e.relatedTarget) return; form.classList.remove("drag"); }); });
  document.addEventListener("drop", function (e) { if (e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0]) { e.preventDefault(); attach(e.dataTransfer.files[0]); } });

  var MOCK_THESIS = { title: "AI-native climate and weather intelligence", query: "students building AI weather and climate emulation models", keywords: "weather emulation climate machine learning", criteria: ["Proprietary data or sensing", "Deep physical-science expertise", "Recurring vertical revenue"] };
  function readThesis(f, note) {
    if (MOCK_PARAM) return new Promise(function (res) { setTimeout(function () { res(MOCK_THESIS); }, 900); });
    return withSnapshot("thesis", f.name, function () {
      return postJson("/api/thesis", { text: (note ? "Investor note: " + note + "\n\n" : "") + f.text, filename: f.name }, 30000);
    });
  }
  function sendFile(f, note) {
    pending = null; renderAttach();
    document.body.classList.add("has-thread"); input.rows = 1; resetBtn.hidden = false; input.value = ""; grow();
    var u = document.createElement("div"); u.className = "msg-u settle";
    u.innerHTML = fileChip(f, false) + (note ? "<div>" + esc(note) + "</div>" : "");
    thread.appendChild(u); scrollToEl(u);
    var el = addAssistant();
    folderLoad(el, "Reading " + f.name);
    setBusy(true);
    (f.ready || Promise.resolve(f)).then(function () {
      if (f.err) throw new Error(f.name + ": " + f.err + ".");
      return readThesis(f, note);
    }).then(function (t) {
      var card = '<div class="thesis-card settle"><span class="label">Thesis read from ' + esc(f.name) + "</span><h3>" + esc(t.title) + '</h3><div class="q">Searching: ' + esc(t.query) + "</div>" +
        (t.criteria && t.criteria.length ? '<div class="crit">' + t.criteria.map(function (c) { return '<span class="pill">' + esc(c) + "</span>"; }).join("") + "</div>" : "") + "</div>";
      el.innerHTML = card;
      var res = addAssistant();
      setBusy(false);
      return search(t.query, res, t.criteria || []);
    }).catch(function (err) {
      setBusy(false);
      el.innerHTML = '<div class="err" role="alert"><span>' + esc(err && err.message ? err.message : "Could not read the file.") + " Try a text-based PDF, or paste the thesis.</span></div>";
    });
  }

  function send(text) {
    if (pending && !busy) { sendFile(pending, String(text || "").trim()); return; }
    text = String(text || "").trim();
    if (!text || busy) return;
    document.body.classList.add("has-thread");
    input.rows = 1;
    resetBtn.hidden = false;
    input.value = ""; grow();
    var u = addUser(text);
    var f = parseFollow(text), prev = latest();
    if (f && f.kind === "filter") {
      var el = addAssistant();
      var r = { id: ++rid, data: prev.data, q: prev.q, criteria: prev.criteria || [], st: f.st, sel: 0, meter: null, mail: null, el: el, ms: 0, at: Date.now() };
      replies.push(r); el.setAttribute("data-r", replies.length - 1);
      renderDrawer(r);
    } else if (f && (f.kind === "email" || f.kind === "more")) {
      var list = prev.list || apply(prev), c = list[f.n - 1];
      if (!c) {
        addAssistant().innerHTML = '<div class="empty">No student #' + f.n + " in the last reply. It lists " + list.length + ".</div>";
      } else if (f.kind === "email") {
        addAssistant().innerHTML = '<p class="hdr">Intro email · <b>' + esc(c.name) + '</b></p><div class="mail"><pre data-mail="1">' + esc(emailText(c, prev.data.keywords || prev.q)) + '<button type="button" class="copy-btn" data-act="copyplain"><span>Copy email</span></button></pre></div>';
      } else {
        var titles = (c.works || []).slice(0, 3).map(function (w) { return w.title; }).join("; ");
        search(prev.q + "; similar to: " + titles, null, prev.criteria || []);
      }
    } else {
      search(text);
    }
    scrollToEl(u);
  }
  function syncSend() { btn.disabled = busy || !(input.value.trim() || pending); }
  function setBusy(b) { busy = b; document.body.classList.toggle("is-loading", !!b); syncSend(); }
  function grow() { input.style.height = "auto"; input.style.height = Math.min(input.scrollHeight, 160) + "px"; syncSend(); }
  function placeholder() { input.placeholder = replies.length ? "Refine: only NYU, current students, top 3, email #1…" : "Add your thesis and find founders"; }

  /* ---------- events ---------- */
  function cycle(arr, v) { return arr[(arr.indexOf(v) + 1) % arr.length]; }
  thread.addEventListener("click", function (e) {
    var t = e.target.closest("button");
    if (!t) return;
    var retry = t.getAttribute("data-retry");
    if (retry != null) { var host0 = t.closest(".msg-a"); if (!busy) search(retry, host0, host0.crit || []); return; }
    var say = t.getAttribute("data-say");
    if (say) { send(say); return; }
    var act = t.getAttribute("data-act");
    if (act === "copyplain") { copy(t.parentNode.textContent.replace(/Copy email$|Copied$/, ""), t, "Copy email"); return; }
    var host = t.closest(".msg-a[data-r]");
    var r = host && replies[+host.getAttribute("data-r")];
    if (!r) return;
    var c = r.list && r.list[r.sel];
    if (t.classList.contains("ftab")) { selectTab(r, +t.getAttribute("data-k"), true); return; }
    if (act === "pull") { r.pulled = true; r.openStages = r.openStages || { "04": true }; }
    else if (act === "drawer") r.pulled = false;
    else if (act === "stage") {
      var stage = t.getAttribute("data-stage");
      var nextOpen = Object.assign({}, r.openStages || { "04": true });
      nextOpen[stage] = !nextOpen[stage];
      r.openStages = nextOpen;
    }
    else if (act === "trait") {
      var prevPartner = r.partner || { traits: {}, call: "" };
      var traits = Object.assign({}, prevPartner.traits);
      traits[t.getAttribute("data-key")] = t.getAttribute("data-level");
      r.partner = { traits: traits, call: prevPartner.call };
    }
    else if (act === "call") {
      var prevCall = r.partner || { traits: {}, call: "" };
      var call = t.getAttribute("data-call");
      r.partner = { traits: Object.assign({}, prevCall.traits), call: call };
      r.mail = call === "meet" ? r.sel : null;
    }
    else if (act === "school") r.st.school = cycle(SCHOOLS, r.st.school);
    else if (act === "status") r.st.status = cycle(STATUS, r.st.status);
    else if (act === "build") r.st.build = cycle(BUILD, r.st.build);
    else if (act === "win") r.st.win = cycle(WINDOWS, r.st.win);
    else if (act === "sort") r.st.sort = cycle(SORTS, r.st.sort);
    else if (act === "top") r.st.top = 0;
    else if (act === "meter") { var k = +t.getAttribute("data-k"); r.meter = r.meter === k ? null : k; }
    else if (act === "reach") r.mail = r.mail === r.sel ? null : r.sel;
    else if (act === "copybrief") { if (c) copy(copyText(c), t, "Copy brief"); return; }
    else if (act === "copymail") { if (c) copy(emailText(c, r.data.keywords || r.q), t, "Copy email"); return; }
    else if (act === "memo") { exportMemo(r); return; }
    else return;
    if (/school|status|build|win|sort|top/.test(act || "")) { r.sel = 0; r.meter = null; r.mail = null; r.pulled = false; }
    var focusAct = act, focusK = t.getAttribute("data-k");
    renderDrawer(r);
    var again = r.el.querySelector('[data-act="' + focusAct + '"]' + (focusK != null ? '[data-k="' + focusK + '"]' : ""));
    if (again) again.focus();
  });
  function selectTab(r, k, focus) {
    if (!r.list || !r.list.length) return;
    k = (k + r.list.length) % r.list.length;
    if (k !== r.sel) { r.sel = k; r.meter = null; r.mail = null; }
    renderDrawer(r);
    if (focus) { var b = r.el.querySelector("#tab-" + r.id + "-" + k); if (b) b.focus(); }
  }
  thread.addEventListener("keydown", function (e) {
    var t = e.target;
    if (!t.classList || !t.classList.contains("ftab")) return;
    var r = replies[+t.closest(".msg-a").getAttribute("data-r")], k = +t.getAttribute("data-k");
    // visual order: top of stack = last rank, so Up/Left moves toward the back (higher index)
    var map = { ArrowUp: 1, ArrowLeft: 1, ArrowDown: -1, ArrowRight: -1 };
    if (e.key in map) { e.preventDefault(); selectTab(r, k + map[e.key], true); }
    else if (e.key === "Home") { e.preventDefault(); selectTab(r, 0, true); }
    else if (e.key === "End") { e.preventDefault(); selectTab(r, r.list.length - 1, true); }
  });
  starters.addEventListener("click", function (e) {
    var c = e.target.closest(".chip");
    if (c) send(c.getAttribute("data-q"));
  });
  form.addEventListener("submit", function (e) { e.preventDefault(); send(input.value); });
  input.addEventListener("keydown", function (e) {
    if (e.key === "Enter" && !e.shiftKey && !e.isComposing) { e.preventDefault(); send(input.value); }
  });
  input.addEventListener("input", grow);
  resetBtn.addEventListener("click", function () {
    if (busy) return;
    replies = []; lastQ = ""; thread.innerHTML = "";
    document.body.classList.remove("has-thread", "has-ranked"); resetBtn.hidden = true; input.rows = 2;
    sourceNotice.hidden = true; picker.hidden = true;
    placeholder(); window.scrollTo(0, 0); input.focus();
  });

  if (MOCK_PARAM) send(MOCK.query);
})();
</script>
</body>
</html>

  .evgrp { display: grid; grid-template-columns: 150px 1fr; gap: 6px 14px; font-size: 14px; }

  .evgrp li { overflow-wrap: anywhere; }

  .actions .btn { height: 34px; font-size: 11.5px; }

  body.has-thread .ls-foot { display: none; }

  .thesis-card .q { font: 500 13px/1.4 var(--mono); }
  .thesis-card .crit { display: flex; flex-wrap: wrap; gap: 6px; }
  .fit { border: var(--bw) solid var(--ink); border-radius: var(--r); background: var(--sheet); padding: 12px 14px; display: grid; gap: 8px; }
  .fit ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
  .fit li { display: grid; grid-template-columns: 56px 1fr; gap: 10px; align-items: start; font-size: 14px; line-height: 1.4; }
  .fit li b { font-weight: 600; margin-right: 6px; }
  .fit .v { font: 600 11px/20px var(--mono); text-transform: uppercase; letter-spacing: .08em; text-align: center; border: var(--bw) solid var(--ink); border-radius: 4px; }
  .fit .v-yes { background: var(--ink); color: var(--sheet); }
  .fit .v-no { color: var(--ink-3); border-color: var(--ink-3); }
  .since { display: flex; flex-wrap: wrap; gap: 10px; align-items: baseline; margin: 0 0 10px; font: 400 13px/1.5 var(--mono); }
  .since .label { background: var(--hi); padding: 2px 6px; border-radius: 4px; }
  .replay { font: 400 11px/1 var(--mono); text-transform: uppercase; letter-spacing: .1em; color: var(--ink-3); border: var(--bw) solid var(--ink-3); border-radius: 4px; padding: 3px 6px; }
</style>

<div id="ls-top"></div>
<main class="page">
  <div class="wrap">
    <div class="chat">
      <section class="hero" id="hero">
        <h1 class="h-display">Find the founder <em>before</em> the company.</h1>
        <p class="lead">Type a thesis. Get NYC students already publishing on it, ranked.</p>
      </section>

      <div class="thread" id="thread" aria-live="polite"></div>

      <div class="dock">
        <form class="composer" id="f">
          <label class="sr" for="q">Investment thesis or follow-up</label>
          <div class="attach" id="attach" hidden></div>
          <textarea id="q" rows="2" autocomplete="off" placeholder="Describe your thesis, or attach it as a PDF…"></textarea>
          <input type="file" id="file" accept=".pdf,.txt,.md,application/pdf,text/plain,text/markdown" hidden>
          <button class="btn ghost clip" id="clip" type="button" aria-label="Attach thesis file (PDF, TXT, MD)" title="Attach thesis (PDF, TXT, MD)"></button>
          <button class="btn send" id="go" type="submit" aria-label="Send"></button>
        </form>
        <div class="hint"><span class="k">Enter to send · Shift+Enter new line</span><button type="button" id="reset" hidden></button></div>
        <div class="starters" id="starters">
          <button type="button" class="chip" id="upload-chip">Upload thesis (PDF)</button>
          <button type="button" class="chip" data-q="students working on protein design with diffusion models">Protein design + diffusion</button>
          <button type="button" class="chip" data-q="LLM agents for software engineering">LLM coding agents</button>
          <button type="button" class="chip" data-q="battery materials discovery with machine learning">ML battery materials</button>
          <button type="button" class="chip" data-q="robot learning for manipulation and dexterous hands">Robot manipulation</button>
        </div>
      </div>
    </div>
  </div>
</main>
<div id="ls-foot"></div>

    if (/\b(current|enrolled|only students|still in school)\b/.test(t)) { next.status = "Current"; hit = true; }
    if (/\bgithub\b|\bbuilders?\b/.test(t)) { next.build = "GitHub"; hit = true; }
    if ((m = t.match(/\btop\s*(\d+)\b/))) { next.top = Math.max(1, +m[1]); hit = true; }
    if (/cit(ed|ation)/.test(t)) { next.sort = "Citations"; hit = true; }
    else if (/\b(most papers|prolific|by papers)\b/.test(t)) { next.sort = "Papers"; hit = true; }
    else if (/\bby score\b/.test(t)) { next.sort = "Score"; hit = true; }
    if (/\b2026\b|this year/.test(t)) { next.win = "2026"; hit = true; }
    else if (/\b2025\b|last (12|twelve) months/.test(t)) { next.win = "2025–26"; hit = true; }
    return hit ? { kind: "filter", st: next } : null;
  }
  /* ---------- thesis upload ---------- */
  var fileInput = document.getElementById("file"), attachEl = document.getElementById("attach"), clipBtn = document.getElementById("clip");
  clipBtn.innerHTML = icon("clip", 18);
  var pending = null; // { name, size, text|null, err|null, ready: Promise }
  var pdfjsP = null;
  function loadPdfjs() {
    if (!pdfjsP) pdfjsP = import("/vendor/pdfjs/pdf.min.mjs").then(function (m) { m.GlobalWorkerOptions.workerSrc = "/vendor/pdfjs/pdf.worker.min.mjs"; return m; });
    return pdfjsP;
  }
  function extractText(file) {
    if (/\.pdf$/i.test(file.name) || file.type === "application/pdf") {
      return Promise.all([loadPdfjs(), file.arrayBuffer()]).then(function (x) {
        return x[0].getDocument({ data: new Uint8Array(x[1]) }).promise;
      }).then(function (doc) {
        var pages = [], n = Math.min(doc.numPages, 30);
        var chain = Promise.resolve();
        for (var i = 1; i <= n; i++) (function (i) {
          chain = chain.then(function () { return doc.getPage(i); }).then(function (pg) { return pg.getTextContent(); })
            .then(function (tc) { pages.push(tc.items.map(function (it) { return it.str + (it.hasEOL ? "\n" : " "); }).join("")); });
        })(i);
        return chain.then(function () { return pages.join("\n\n"); });
      });
    }
    return file.text();
  }
  function kb(n) { return n > 1048576 ? (n / 1048576).toFixed(1) + " MB" : Math.max(1, Math.round(n / 1024)) + " KB"; }
  function fileChip(f, removable) {
    var state = f.err ? " · " + f.err : f.text == null ? " · reading…" : " · " + f.text.split(/\s+/).filter(Boolean).length + " words";
    return '<span class="file-chip">' + icon("paper", 14) + "<span>" + esc(f.name) + '</span><span class="meta">' + esc(kb(f.size) + state) + "</span>" +
      (removable ? '<button type="button" data-act="unattach" aria-label="Remove attachment">' + icon("x", 14) + "</button>" : "") + "</span>";
  }
  function renderAttach() {
    attachEl.hidden = !pending;
    attachEl.innerHTML = pending ? fileChip(pending, true) : "";
  }
  function attach(file) {
    if (!file) return;
    if (file.size > 15 * 1048576) { pending = { name: file.name, size: file.size, text: null, err: "too large (max 15 MB)" }; renderAttach(); return; }
    var f = pending = { name: file.name, size: file.size, text: null, err: null };
    f.ready = extractText(file).then(function (t) { f.text = String(t || ""); if (f.text.trim().length < 80) f.err = "no readable text (scanned?)"; })
      .catch(function () { f.err = "could not read file"; }).then(function () { if (pending === f) renderAttach(); return f; });
    renderAttach();
    input.focus();
  }
  clipBtn.addEventListener("click", function () { fileInput.click(); });
  document.getElementById("upload-chip").addEventListener("click", function () { fileInput.click(); });
  fileInput.addEventListener("change", function () { attach(fileInput.files[0]); fileInput.value = ""; });
  attachEl.addEventListener("click", function (e) { if (e.target.closest('[data-act="unattach"]')) { pending = null; renderAttach(); } });
  ["dragenter", "dragover"].forEach(function (ev) { document.addEventListener(ev, function (e) { if (e.dataTransfer && Array.prototype.indexOf.call(e.dataTransfer.types, "Files") >= 0) { e.preventDefault(); form.classList.add("drag"); } }); });
  ["dragleave", "drop"].forEach(function (ev) { document.addEventListener(ev, function (e) { if (ev === "dragleave" && e.relatedTarget) return; form.classList.remove("drag"); }); });
  document.addEventListener("drop", function (e) { if (e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0]) { e.preventDefault(); attach(e.dataTransfer.files[0]); } });

  var MOCK_THESIS = { title: "AI-native climate and weather intelligence", query: "students building AI weather and climate emulation models", keywords: "weather emulation climate machine learning", criteria: ["Proprietary data or sensing", "Deep physical-science expertise", "Recurring vertical revenue"] };
  function readThesis(f, note) {
    if (MOCK_PARAM) return new Promise(function (res) { setTimeout(function () { res(MOCK_THESIS); }, 900); });
    return withSnapshot("thesis", f.name, function () {
      return postJson("/api/thesis", { text: (note ? "Investor note: " + note + "\n\n" : "") + f.text, filename: f.name }, 30000);
    });
  }
  function sendFile(f, note) {
    pending = null; renderAttach();
    document.body.classList.add("has-thread"); input.rows = 1; resetBtn.hidden = false; input.value = ""; grow();
    var u = document.createElement("div"); u.className = "msg-u settle";
    u.innerHTML = fileChip(f, false) + (note ? "<div>" + esc(note) + "</div>" : "");
    thread.appendChild(u); scrollToEl(u);
    var el = addAssistant();
    el.innerHTML = '<p class="hdr">Reading ' + esc(f.name) + ' · Nicrron</p><ol class="steps"><li class="active"><span class="ic"></span>Extracting the thesis…</li></ol>';
    setBusy(true);
    (f.ready || Promise.resolve(f)).then(function () {
      if (f.err) throw new Error(f.name + ": " + f.err + ".");
      return readThesis(f, note);
    }).then(function (t) {
      var card = '<div class="thesis-card settle"><span class="label">Thesis read from ' + esc(f.name) + "</span><h3>" + esc(t.title) + '</h3><div class="q">Searching: ' + esc(t.query) + "</div>" +
        (t.criteria && t.criteria.length ? '<div class="crit">' + t.criteria.map(function (c) { return '<span class="pill">' + esc(c) + "</span>"; }).join("") + "</div>" : "") + "</div>";
      el.innerHTML = card;
      var res = addAssistant();
      setBusy(false);
      return search(t.query, res, t.criteria || []);
    }).catch(function (err) {
      setBusy(false);
      el.innerHTML = '<div class="err" role="alert"><span>' + esc(err && err.message ? err.message : "Could not read the file.") + " Try a text-based PDF, or paste the thesis.</span></div>";
    });
  }

  function send(text) {
    if (pending && !busy) { sendFile(pending, String(text || "").trim()); return; }
    text = String(text || "").trim();
    if (!text || busy) return;
    document.body.classList.add("has-thread");
    input.rows = 1;
    resetBtn.hidden = false;
    input.value = ""; grow();
    var u = addUser(text);
    var f = parseFollow(text), prev = latest();
    if (f && f.kind === "filter") {
      var el = addAssistant();
      var r = { id: ++rid, data: prev.data, q: prev.q, criteria: prev.criteria || [], st: f.st, sel: 0, meter: null, mail: null, el: el, ms: 0 };
      replies.push(r); el.setAttribute("data-r", replies.length - 1);
      renderDrawer(r);
    } else if (f && (f.kind === "email" || f.kind === "more")) {
      var list = prev.list || apply(prev), c = list[f.n - 1];
      if (!c) {
        addAssistant().innerHTML = '<div class="empty">No student #' + f.n + " in the last reply. It lists " + list.length + ".</div>";
      } else if (f.kind === "email") {
        addAssistant().innerHTML = '<p class="hdr">Intro email · <b>' + esc(c.name) + '</b></p><div class="mail"><pre data-mail="1">' + esc(emailText(c, prev.data.keywords || prev.q)) + '<button type="button" class="copy-btn" data-act="copyplain"><span>Copy email</span></button></pre></div>';
      } else {
        var titles = (c.works || []).slice(0, 3).map(function (w) { return w.title; }).join("; ");
        search(prev.q + "; similar to: " + titles, null, prev.criteria || []);
      }
    } else {
      search(text);
    }
    scrollToEl(u);
  }
  function setBusy(b) { busy = b; btn.disabled = b; }
  function grow() { input.style.height = "auto"; input.style.height = Math.min(input.scrollHeight, 160) + "px"; }
  function placeholder() { input.placeholder = replies.length ? "Refine: only NYU, current students, top 3, email #1…" : "Describe your thesis…"; }

  /* ---------- events ---------- */
  function cycle(arr, v) { return arr[(arr.indexOf(v) + 1) % arr.length]; }
  thread.addEventListener("click", function (e) {
    var t = e.target.closest("button");
    if (!t) return;
    var retry = t.getAttribute("data-retry");
    if (retry != null) { var host0 = t.closest(".msg-a"); if (!busy) search(retry, host0, host0.crit || []); return; }
    var say = t.getAttribute("data-say");
    if (say) { send(say); return; }
    var act = t.getAttribute("data-act");
    if (act === "copyplain") { copy(t.parentNode.textContent.replace(/Copy email$|Copied$/, ""), t, "Copy email"); return; }
    var host = t.closest(".msg-a[data-r]");
    var r = host && replies[+host.getAttribute("data-r")];
    if (!r) return;
    var c = r.list && r.list[r.sel];
    if (t.classList.contains("ftab")) { selectTab(r, +t.getAttribute("data-k"), true); return; }
    if (act === "school") r.st.school = cycle(SCHOOLS, r.st.school);
    else if (act === "status") r.st.status = cycle(STATUS, r.st.status);
    else if (act === "build") r.st.build = cycle(BUILD, r.st.build);
    else if (act === "win") r.st.win = cycle(WINDOWS, r.st.win);
    else if (act === "sort") r.st.sort = cycle(SORTS, r.st.sort);
    else if (act === "top") r.st.top = 0;
    else if (act === "meter") { var k = +t.getAttribute("data-k"); r.meter = r.meter === k ? null : k; }
    else if (act === "reach") r.mail = r.mail === r.sel ? null : r.sel;
    else if (act === "copybrief") { if (c) copy(copyText(c), t, "Copy brief"); return; }
    else if (act === "copymail") { if (c) copy(emailText(c, r.data.keywords || r.q), t, "Copy email"); return; }
    else if (act === "memo") { exportMemo(r); return; }
    else return;
    if (/school|status|build|win|sort|top/.test(act)) { r.sel = 0; r.meter = null; r.mail = null; }
    var focusAct = act, focusK = t.getAttribute("data-k");
    renderDrawer(r);
    var again = r.el.querySelector('[data-act="' + focusAct + '"]' + (focusK != null ? '[data-k="' + focusK + '"]' : ""));
    if (again) again.focus();
  });
  function selectTab(r, k, focus) {
    if (!r.list || !r.list.length) return;
    k = (k + r.list.length) % r.list.length;
    if (k !== r.sel) { r.sel = k; r.meter = null; r.mail = null; }
    renderDrawer(r);
    if (focus) { var b = r.el.querySelector("#tab-" + r.id + "-" + k); if (b) b.focus(); }
  }
  thread.addEventListener("keydown", function (e) {
    var t = e.target;
    if (!t.classList || !t.classList.contains("ftab")) return;
    var r = replies[+t.closest(".msg-a").getAttribute("data-r")], k = +t.getAttribute("data-k");
    // visual order: top of stack = last rank, so Up/Left moves toward the back (higher index)
    var map = { ArrowUp: 1, ArrowLeft: 1, ArrowDown: -1, ArrowRight: -1 };
    if (e.key in map) { e.preventDefault(); selectTab(r, k + map[e.key], true); }
    else if (e.key === "Home") { e.preventDefault(); selectTab(r, 0, true); }
    else if (e.key === "End") { e.preventDefault(); selectTab(r, r.list.length - 1, true); }
  });
  starters.addEventListener("click", function (e) { var c = e.target.closest(".chip"); if (c) send(c.getAttribute("data-q")); });
  form.addEventListener("submit", function (e) { e.preventDefault(); send(input.value); });
  input.addEventListener("keydown", function (e) {
    if (e.key === "Enter" && !e.shiftKey && !e.isComposing) { e.preventDefault(); send(input.value); }
  });
  input.addEventListener("input", grow);
  resetBtn.addEventListener("click", function () {
    if (busy) return;
    replies = []; lastQ = ""; thread.innerHTML = "";
    document.body.classList.remove("has-thread"); resetBtn.hidden = true; input.rows = 2;
    placeholder(); window.scrollTo(0, 0); input.focus();
  });

  if (MOCK_PARAM) send(MOCK.query);
})();
</script>
</body>
</html>
